
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dirt Cat Records</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <header>
        <img src="images/file-VaE9LYaNLwxBDTj2HK4J2y.jpeg" alt="Dirt Cat Records Logo" class="logo"/>
    </header>
    <section class="about">
        <h2>About the Studio</h2>
        <p>Cozy, vibe-rich home studio equipped with precision analog gear and digital tools to bring your sound to life – whether you’re laying down vocals or finalizing a full mix.</p>
    </section>
    <section class="images">
        <h2>Studio Gallery</h2>
        <div class="gallery">
            <img src="images/file-XSm348p7XDb8ThAGV7Y8gD.jpeg" />
            <img src="images/file-WroCEgZtbHkRFr6Tbap4pL.jpeg" />
            <img src="images/file-4HoFs1LPTM89z8jWbKgis1.jpeg" />
            <img src="images/file-7TBU71sokGbsEy6cTZHdaN.jpeg" />
            <img src="images/file-BLTLDoruMXqTV4poGq3JXu.jpeg" />
            <img src="images/file-Po4syihsgPqaEL74FhT2F8.jpeg" />
            <img src="images/file-6X4vxwjxXJiJ3Sn57u6CAy.jpeg" />
        </div>
    </section>
    <section class="form">
        <h2>Book a Session</h2>
        <form action="https://formspree.io/f/mwkgepgd" method="POST">
            <input type="text" name="name" placeholder="Name" required />
            <input type="email" name="email" placeholder="Email" required />
            <textarea name="message" placeholder="Tell us about your project" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
</body>
</html>
