<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dirt Cat Records Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav id="main-nav">
      <ul>
        <li><a href="index.html#hero-container">Home</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="portal.html">Portal</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
    </nav>

    <main class="portal-shell">
      <section class="portal-login" id="portal-login">
        <h1>Project Portal</h1>
        <form id="magic-link-form">
          <input type="email" name="email" placeholder="Email" required />
          <button class="btn" type="submit">Send Magic Link</button>
        </form>
      </section>
      <p
        class="portal-status-message"
        id="portal-status"
        role="status"
        aria-live="polite"
        hidden
      ></p>
      <section class="portal-projects" id="portal-projects" hidden></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/portal/action-policy.js"></script>
    <script src="lib/portal/action-rules.js"></script>
    <script src="portal-view.js"></script>
    <script src="nav.js"></script>
    <script src="portal.js"></script>
  </body>
</html>
